name: Prepare macOS release (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Validate platform
        run: test "$(uname -m)" = arm64
      - name: Install build-test dependency
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Test
        run: |
          uv sync --locked --group dev --group package
          uv run python scripts/package.py --runtime-only
          uv run pytest -q
          uv run ruff check src tests scripts packaging
          uv run ruff format --check src tests scripts packaging
          bash -n install.sh
      - name: Build and validate isolated installation
        run: ./package.command
      - uses: actions/upload-artifact@v4
        with:
          name: ytdock-macos-arm64
          path: |
            dist/ytdock-*.zip
            dist/ytdock-*.tar.gz
            dist/ytdock-*.sha256
          if-no-files-found: error
