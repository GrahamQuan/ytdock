[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytdock"
version = "0.8.1"
description = "Bilingual interactive YouTube downloader and local video compressor for macOS"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp[default]>=2025.11.12",
  "prompt-toolkit>=3.0.50,<4",
  "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
]

[project.scripts]
ytdock = "ytdock.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
package = ["pyinstaller>=6.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/ytdock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
